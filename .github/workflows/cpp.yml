# Builds the C++ VIO (cpp/) and runs its unit tests on x86-64 and arm64
# (the Jetson's architecture), and checks that the Docker image builds.
name: cpp

on:
  push:
    paths: ['cpp/**', '.github/workflows/cpp.yml', '.dockerignore']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml', '.dockerignore']

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # Ubuntu 24.04: Eigen 3.4, OpenCV 4.6, Ceres 2.2, yaml-cpp 0.8, Boost 1.83.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libeigen3-dev libopencv-dev libceres-dev \
            libyaml-cpp-dev libboost-dev libgtest-dev

      - name: Configure
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (runs the tests inside)
        run: docker build -t classical-vio -f cpp/Dockerfile .
